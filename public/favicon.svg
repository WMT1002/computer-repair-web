<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Primary Emblem Gradient (FixFlow Cyan-Emerald) -->
    <linearGradient id="ffGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="ffGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hexagon/Squircle Badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="12" />

  <!-- Ambient Glow Effect in Center -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- FixFlow Minimal Geometric "FF" Tech Monogram -->
  <g id="FixFlow-Badge" filter="url(#glow)">
    <!-- First 'F' (Main Spine & Top Bar) -->
    <path 
      d="M136 136 
         C136 122.7 146.7 112 160 112 
         L352 112 
         C365.3 112 376 122.7 376 136 
         L376 160 
         C376 173.3 365.3 184 352 184 
         L216 184 
         L216 220 
         L320 220 
         C333.3 220 344 230.7 344 244 
         L344 264 
         C344 277.3 333.3 288 320 288 
         L216 288 
         L216 376 
         C216 389.3 205.3 400 192 400 
         L160 400 
         C146.7 400 136 389.3 136 376 
         Z" 
      fill="url(#ffGradPrimary)" 
    />

    <!-- Dynamic Second 'F' / Flow Element & Tech Node Dot -->
    <!-- Forward Flow Bar -->
    <path 
      d="M260 324 
         L356 324 
         C369.3 324 380 334.7 380 348 
         L380 368 
         C380 381.3 369.3 392 356 392 
         L260 392 
         C246.7 392 236 381.3 236 368 
         L236 348 
         C236 334.7 246.7 324 260 324 
         Z" 
      fill="url(#ffGradAccent)" 
    />

    <!-- Speed/Pulse Accent Tech Nodes -->
    <circle cx="396" cy="148" r="14" fill="#38bdf8" />
    <circle cx="368" cy="254" r="12" fill="#2dd4bf" />
    <circle cx="406" cy="358" r="12" fill="#34d399" />
  </g>
</svg>
